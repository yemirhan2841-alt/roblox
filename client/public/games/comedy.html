<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Troll Clicker - Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: linear-gradient(180deg, #ff0055 0%, #8e0035 100%); color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#score { font-size: 60px; font-weight: 900; margin-bottom: 14px; text-shadow: 3px 3px 0 #000; }
#btn { width: 190px; height: 190px; border-radius: 50%; background: #ffd700; border: 6px solid #fff; color: #000; font-weight: 900; font-size: 20px; cursor: pointer; box-shadow: 0 0 40px rgba(0,0,0,0.4); transition: transform 0.08s, filter 0.2s; outline: none; }
#btn:active { transform: scale(0.85); filter: brightness(1.3); }
#msg { margin-top: 16px; font-size: 18px; font-weight: 800; color: #ffe6e6; height: 1.2em; }
</style>
</head>
<body>
<div id="score">0</div>
<button id="btn" onclick="clickBtn()">TROLL'E TIKLA</button>
<div id="msg">Hehe...</div>
<script>
let score = 0;
const msgs = ['Hehe...', 'Bunu tekrarla!', 'Niye oynuyorsun?', 'Çok eğlenceli!', 'Trol durdu!', 'Tamam dur şimdi!'];
const scoreEl = document.getElementById('score');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

function clickBtn() {
  score++;
  scoreEl.textContent = score;
  if (score % 10 === 0) msg.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  const x = btn.offsetLeft + btn.offsetWidth/2 + (Math.random() - 0.5) * 40;
  const y = btn.offsetTop + btn.offsetHeight/2 + (Math.random() - 0.5) * 40;
  btn.style.transform = `translate(${x - btn.offsetLeft}px, ${y - btn.offsetTop}px)`;
  setTimeout(() => btn.style.transform = '', 150);
}
</script>
</body>
</html>
