<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strength Simulator - Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #0f0f12; color: #f0f0f0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#stat { font-size: 44px; font-weight: 900; margin-bottom: 12px; text-shadow: 0 0 20px #00d26a; }
#btn { width: 170px; height: 170px; border-radius: 50%; background: linear-gradient(135deg, #00d26a, #2ecc71); border: none; color: #fff; font-weight: 900; font-size: 18px; cursor: pointer; box-shadow: 0 0 30px rgba(0,210,106,0.6); transition: transform 0.05s; outline: none; }
#btn:active { transform: scale(0.9); }
#multi { margin-bottom: 8px; color: #a0a0a8; font-size: 16px; }
#upg { position: absolute; bottom: 40px; display: flex; gap: 12px; }
.upg { padding: 8px 14px; border: 1px solid #2a2a33; border-radius: 8px; background: #1a1a1f; color: #fff; font-size: 13px; cursor: pointer; }
.upg:hover { border-color: #00d26a; }
.upg:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="stat">0 kg</div>
<div id="multi">Çarpan: 1x</div>
<button id="btn">KALDIR</button>
<div id="upg">
  <button class="upg" id="u1" onclick="buy(1)">Güç (25)</button>
  <button class="upg" id="u2" onclick="buy(2)">Süper Güç (100)</button>
</div>
<script>
let weight = 0;
let mult = 1;
const statEl = document.getElementById('stat');
const btn = document.getElementById('btn');
const multiEl = document.getElementById('multi');

function update() {
  statEl.textContent = weight.toLocaleString() + ' kg';
  multiEl.textContent = 'Çarpan: ' + mult + 'x';
  document.getElementById('u1').disabled = weight < 25;
  document.getElementById('u2').disabled = weight < 100;
}

let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000;
  last = now;
  update();
  requestAnimationFrame(loop);
}

btn.addEventListener('mousedown', () => { weight += 1 * mult; update(); });
btn.addEventListener('touchstart', e => { e.preventDefault(); weight += 1 * mult; update(); }, {passive:false});

function buy(id) {
  if (id === 1 && weight >= 25) { weight -= 25; mult += 1; }
  if (id === 2 && weight >= 100) { weight -= 100; mult += 5; }
  update();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
