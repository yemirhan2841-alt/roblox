<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Defender - Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #0d0d10; font-family: system-ui, sans-serif; color: #fff; }
canvas { display: block; margin: 0 auto; background: #161b1f; border: 2px solid #222; }
#ui { position: absolute; top: 12px; left: 12px; font-size: 16px; font-weight: 800; color: #ff0055; text-shadow: 1px 1px 0 #000; pointer-events: none; }
#hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #666; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">Can: <span id="hp">100</span> &nbsp;|&nbsp; Skor: <span id="sc">0</span></div>
<div id="hint">Fare: tower kur (tıkla) · Düşmanları engelle</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let hp = 100, score = 0;
const towers = [];
const enemies = [];
const shots = [];
const mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
window.addEventListener('mousedown', () => {
  if (hp > 0 && score >= 15) {
    towers.push({ x: mouse.x, y: mouse.y, r: 14, cd: 0 });
    score -= 15;
  }
});

function spawn() { enemies.push({ x: W + 20, y: Math.random() * (H - 40) + 20, r: 11, vx: -(1.5 + Math.random() * 2), hp: 20 }); }
let st = 0;

function update() {
  st++;
  if (st > 60) { st = 0; spawn(); }

  enemies.forEach((e, ei) => {
    e.x += e.vx;
    e.hp -= 0.05;
    if (e.x + e.r < 0) { hp -= 10; enemies.splice(ei, 1); }
    if (e.hp <= 0) { enemies.splice(ei, 1); score += 10; }
    towers.forEach(t => {
      if (Math.hypot(e.x - t.x, e.y - t.y) < 120) {
        if (t.cd <= 0) { shots.push({ x: t.x, y: t.y, vx: (e.x - t.x) * 0.12, vy: (e.y - t.y) * 0.12 }); t.cd = 40; }
      }
    });
  });

  shots.forEach((s, si) => {
    s.x += s.vx; s.y += s.vy;
    enemies.forEach((e, ei) => {
      if (Math.hypot(s.x - e.x, s.y - e.y) < 18) { e.hp -= 40; shots.splice(si, 1); }
    });
    if (s.x < 0 || s.x > W || s.y < 0 || s.y > H) shots.splice(si, 1);
  });

  towers.forEach(t => { if (t.cd > 0) t.cd--; });

  if (hp <= 0) { setTimeout(() => { hp = 100; score = 0; enemies.length = 0; towers.length = 0; }, 2000); }
  document.getElementById('hp').textContent = Math.max(0, Math.floor(hp));
  document.getElementById('sc').textContent = score;
}

function draw() {
  ctx.fillStyle = '#161b1f';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#222';
  ctx.fillRect(W - 60, 0, 60, H);

  ctx.fillStyle = '#00d2ff';
  towers.forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill(); });

  ctx.fillStyle = '#ff0055';
  enemies.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill(); });

  ctx.fillStyle = '#fff';
  shots.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2); ctx.fill(); });

  if (hp <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff0055';
    ctx.font = 'bold 36px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Base Feth Edildi', W/2, H/2);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
